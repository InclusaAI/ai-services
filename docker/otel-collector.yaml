# OpenTelemetry Collector config for local dev.
# Receives OTLP from the services (traces today; metrics/logs wired for later) and
# just logs them to the collector's stdout. Swap the exporter for your APM in
# staging/prod. Referenced by docker-compose.dev.yml (otel-collector service).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

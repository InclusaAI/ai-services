[project]
name = "inclusaai-contracts"
version = "0.0.0"
description = "LOCAL PLACEHOLDER for @inclusaai/kafka-contracts + @inclusaai/grpc-contracts — event payload models, JSON schemas, and gRPC .proto/stubs. Replace with the published packages when they exist."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "grpcio>=1.66",
    "protobuf>=5.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_contracts"]

[project]
name = "inclusaai-kafka-clients"
version = "0.0.0"
description = "Shared aiokafka producer/consumer wrappers, topic naming, and usage aggregation for InclusaAI inference services."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "pydantic>=2.7",
    "inclusaai-contracts",
    "inclusaai-telemetry",
    "inclusaai-utils",
]

[tool.uv.sources]
inclusaai-contracts = { workspace = true }
inclusaai-telemetry = { workspace = true }
inclusaai-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_kafka_clients"]

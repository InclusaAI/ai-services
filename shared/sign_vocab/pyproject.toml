[project]
name = "inclusaai-sign-vocab"
version = "0.0.0"
description = "Closed constrained ASL vocabulary (phrases + fingerspelling + skeleton) shared by avatar-pose generation and sign-recognition (ADR-0002)."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_sign_vocab"]

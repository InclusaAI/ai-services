[project]
name = "inclusaai-model-loading"
version = "0.0.0"
description = "MLflow model-registry client (read-only) and benchmarking helpers for InclusaAI inference services."
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.14",
    "inclusaai-telemetry",
]

[tool.uv.sources]
inclusaai-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_model_loading"]

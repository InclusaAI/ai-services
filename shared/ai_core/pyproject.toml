[project]
name = "inclusaai-ai-core"
version = "0.0.0"
description = "Base inference-service framework for InclusaAI: FastAPI app factory, config, health, preference-aware gating, scaling signals, and a reusable Kafka pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pydantic-settings>=2.3",
    "inclusaai-telemetry",
    "inclusaai-kafka-clients",
    "inclusaai-contracts",
    "inclusaai-utils",
]

[tool.uv.sources]
inclusaai-telemetry = { workspace = true }
inclusaai-kafka-clients = { workspace = true }
inclusaai-contracts = { workspace = true }
inclusaai-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_ai_core"]

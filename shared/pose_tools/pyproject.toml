[project]
name = "inclusaai-pose-tools"
version = "0.0.0"
description = "pose-format (.pose) interchange: convert between pose-format/MediaPipe Poses and InclusaAI's PoseKeypoint wire contract + 51-point sign skeleton (ADR-0002 plumbing)."
requires-python = ">=3.11"
dependencies = [
    "pose-format>=0.14",
    "inclusaai-sign-vocab",
    "inclusaai-contracts",
]

[tool.uv.sources]
inclusaai-sign-vocab = { workspace = true }
inclusaai-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_pose_tools"]

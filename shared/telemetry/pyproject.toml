[project]
name = "inclusaai-telemetry"
version = "0.0.0"
description = "Structured logging, Prometheus metrics, and OpenTelemetry tracing for InclusaAI inference services."
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inclusaai_telemetry"]

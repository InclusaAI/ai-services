name: tts-service

on:
  push:
    paths:
      - 'services/tts-service/**'
      - 'shared/**'
      - '.github/workflows/tts-service.yml'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/tts-service/**'
      - 'shared/**'
      - '.github/workflows/tts-service.yml'
      - '.github/workflows/_service-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: tts-service
